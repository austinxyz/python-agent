schema: spec-driven

# Project context — injected into every artifact's instruction prompt.
context: |
  Tech stack: Python 3.11+ + Flask 3.x backend, LangGraph 0.2+ for agent
  orchestration, Qdrant (self-hosted) for vector storage, SQLite for metadata,
  Vue 3 + Vite + Pinia frontend, Docker Compose for local/NAS/Railway.

  Backend structure: backend/app/ (Flask app factory), backend/app/graphs/
  (LangGraph graphs), backend/app/routes/ (blueprints), backend/app/services/
  (Qdrant, SQLite, embedding), backend/app/models/ (SQLAlchemy or sqlite3 models).

  Frontend structure: frontend/src/views/ (page-level), frontend/src/components/
  (shared components), frontend/src/stores/ (Pinia), frontend/src/api/ (axios).

  Backend tests: pytest + pytest-flask. Unit tests mirror backend/app/ → tests/unit/;
  integration tests in tests/integration/. Run with: cd backend && pytest.

  Frontend tests: vitest + @vue/test-utils + happy-dom. Specs mirror
  frontend/src/ → frontend/tests/. Run with: cd frontend && npm test.

  LLM + Embedding:
    - LLM_PROVIDER env var: 'anthropic' (default) or 'openai'
    - ANTHROPIC_API_KEY / OPENAI_API_KEY via .env
    - DEFAULT_MODEL defaults to claude-haiku-4-5 (configurable via LLM_MODEL env var)
    - Embedding: OpenAI text-embedding-3-small, hard dependency (no Anthropic embedding API)
    - OPENAI_API_KEY required even when LLM_PROVIDER=anthropic

  Qdrant collections:
    - 'knowledge': public knowledge base, payload: domain, topic, source_file_id,
      chunk_index, updated_at, status
    - 'private': user private data, payload MUST include user_id; also: topic,
      template_type, source_file_id, updated_at
    - CRITICAL: every search on 'private' collection MUST add user_id payload filter;
      V1 user_id is always "default"

  Flask SSE:
    - Streaming chat via SSE; use Flask's stream_with_context + Response(generator,
      mimetype='text/event-stream')
    - POST /api/chat returns SSE stream; each event: 'data: {"type":"token","content":"..."}\n\n'
    - Final event: 'data: {"type":"done","sources":[...]}\n\n'

  Conventions:
    - Conventional Commits (feat:/fix:/chore:/docs:/refactor:/test:)
    - All config via environment variables; no hardcoded keys, ports, or paths
    - Private data queries MUST include user_id filter — missing filter is a bug
    - Axios baseURL is '/api' — API calls must NOT add prefix again
    - Component paths use kebab-case (tree-nav/, chat-view/)
    - SQLite accessed via sqlite3 module or SQLAlchemy, no ORM migrations — plain
      SQL schema in backend/db/schema.sql

  Shared component: TreeNav.vue — used by wiki page (/wiki) AND ingest files tab.
  Props: items (tree nodes), onSelect handler. Do not duplicate tree logic.

  Superpowers integration:
    - This project pairs OpenSpec with Anthropic superpowers skills.
    - /opsx:propose triggers superpowers:brainstorming BEFORE artifact
      generation (see .claude/commands/opsx/propose.md).
    - /opsx:apply runs superpowers:test-driven-development at session
      start and superpowers:requesting-code-review at task-group
      checkpoints (see .claude/commands/opsx/apply.md).
    - tasks.md MUST scaffold TDD discipline + review checkpoints so the
      apply phase has the hooks it needs.

# Per-artifact rules — appended to artifact-specific instructions.
# Each rule must be a quoted scalar to avoid YAML multi-line ambiguity.
rules:
  proposal:
    - "Always include a Non-Goals (or Out-of-Scope) section."
    - "Capabilities section MUST list which existing capability is modified. Look in openspec/specs/ first; do not invent capability names."
    - "Reference the requirement IDs from docs/superpowers/specs/2026-05-05-requirements.md (e.g., CHAT-04, ING-01) that this change addresses."
    - "If the change has visual/UX surface, mention that brainstorming has already produced design mockups under docs/superpowers/specs/2026-05-05-knowledge-agent-design.md."
    - "If the change adds a new view / modal / layout / sidebar item, proposal.md MUST link the corresponding mock file under docs/superpowers/specs/mocks/<date>-<topic>-mocks.html. If mocks do not yet exist, the proposal MUST require a brainstorming session with visual companion BEFORE implementation begins, or explicitly state 'no visual mocks; design emerges inline (last resort)'."

  design:
    - "Reference the brainstorming spec doc docs/superpowers/specs/2026-05-05-knowledge-agent-design.md as primary input when relevant."
    - "Decisions section MUST cover alternatives considered, not just the choice made."
    - "For any Qdrant query change: explicitly state whether user_id filter is applied and why."
    - "For any SSE/streaming change: describe the event format (type field + payload) and the terminal event."
    - "If the change has UI surface, design.md MUST include a 'UI Fidelity' section listing: (1) the mock file path + key anchors used, (2) the Notion design tokens implementation MUST use verbatim (e.g., bg-notion-brand-navy for hero bands, bg-notion-primary for primary CTAs, bg-notion-tint-rose for error backgrounds, text-notion-error for error text), (3) verbatim text strings that frontend tests will assert (CTA labels, error messages, key headings). The goal is that vitest can lock fidelity via wrapper.classes() and wrapper.text() — not only data-* selectors."

  specs:
    - "When a requirement describes a UI element (view / modal / layout component / sidebar item), the requirement text SHALL name the specific Notion design tokens it uses (e.g., bg-notion-brand-navy, text-notion-error, bg-notion-tint-lavender) and any verbatim user-facing text strings (CTA labels, error messages, banners). Tests SHALL assert these via wrapper.classes() / wrapper.text(), not only data-* selectors. Token names — not pixel measurements — are the lock-down level."

  tasks:
    - "Each implementation task that introduces NEW behavior MUST be preceded by a RED-failing-test task. Pattern: '- [ ] N.X RED — write failing pytest test for <behavior>' followed by '- [ ] N.X+1 GREEN — minimal impl to pass the test'. Use vitest for Vue components/stores/api, pytest for Flask routes/services/graphs."
    - "Bug fixes MUST be preceded by a regression test that reproduces the bug (RED), then the fix (GREEN)."
    - "Each '## N' task group MUST end with a checkpoint task: '- [ ] N.Z Run superpowers:requesting-code-review on the diff for group N; address CRITICAL/HIGH findings before moving on'."
    - "The final task group MUST include a verification task: '- [ ] M.K Run superpowers:verification-before-completion (cd backend && pytest; cd frontend && npm test; grep -r console.log frontend/src; diff review); ensure no user_id filter is missing from private collection queries'."
    - "Tasks SHOULD explicitly name the superpowers skill to invoke when relevant (e.g., 'Invoke superpowers:test-driven-development to scaffold tests for the new LangGraph node')."
    - "LangGraph graph tasks MUST test nodes independently (unit) before testing the full graph flow (integration)."
    - "For each frontend GREEN task that implements a VIEW, MODAL, or named LAYOUT component (>50 lines; utility helpers / stores / interceptors are exempt), the GREEN task MUST be sandwiched: (a) a preceding MOCK task — '- [ ] N.X MOCK — open docs/superpowers/specs/mocks/<file>.html#<anchor>; note the Notion tokens used (bg-notion-*, text-notion-*) and the verbatim text strings'; and (b) a following VISUAL DIFF task — '- [ ] N.X+2 VISUAL DIFF — bring up dev stack (npm run dev:up), navigate to the route, eyeball rendered UI against the mock; fix any token/color/text drift BEFORE the group's code-review checkpoint'."
    - "When a frontend RED test corresponds to a requirement that names design tokens (per the specs rule above), the test SHALL assert presence via wrapper.classes() — e.g., expect(cls).toMatch(/bg-notion-primary/) — not only data-* selectors. This makes design tokens load-bearing in the test suite."
